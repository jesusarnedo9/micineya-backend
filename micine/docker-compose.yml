version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: cinefila-db
    environment:
      POSTGRES_USER: cinefila_user
      POSTGRES_PASSWORD: cinefila_password
      POSTGRES_DB: cinefila
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: