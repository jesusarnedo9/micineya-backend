spring.application.name=micine

# Configuración de conexión a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/cinefila
spring.datasource.username=cinefila_user
spring.datasource.password=cinefila_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate (el ORM que maneja SQL por vos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
